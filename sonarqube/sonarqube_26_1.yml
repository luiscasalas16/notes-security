services:
  sonarqube:
    image: sonarqube:26.1.0.118079-community
    hostname: sonarqube
    container_name: sonarqube_26_1
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    expose:
      - 9000
    ports:
      - 9000:9000
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgresql:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
      - SONAR_AUTH_JWTBASE64HS256SECRET=dZ0EB0KxnF++nr5+4vfTCaun/eWbv6gOoXodiAMqcFo=
    volumes:
      - sonar_sonarqube_data:/opt/sonarqube/data
      - sonar_sonarqube_logs:/opt/sonarqube/logs
      - sonar_sonarqube_temp:/opt/sonarqube/temp
      - sonar_sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - sonarnet

  postgresql:
    image: postgres:17.7
    hostname: postgresql
    container_name: postgresql_26_1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - sonar_postgresql_data:/var/lib/postgresql/data
    networks:
      - sonarnet

volumes:
  sonar_sonarqube_data:
    name: sonar_26_1_sonarqube_data
    driver: local
    driver_opts:
      o: bind
      type: none
      device: C:\Docker\sonarqube_26_1\sonarqube_data
  sonar_sonarqube_logs:
    name: sonar_26_1_sonarqube_logs
    driver: local
    driver_opts:
      o: bind
      type: none
      device: C:\Docker\sonarqube_26_1\sonarqube_logs
  sonar_sonarqube_temp:
    name: sonar_26_1_sonarqube_temp
    driver: local
    driver_opts:
      o: bind
      type: none
      device: C:\Docker\sonarqube_26_1\sonarqube_temp
  sonar_sonarqube_extensions:
    name: sonar_26_1_sonarqube_extensions
    driver: local
    driver_opts:
      o: bind
      type: none
      device: C:\Docker\sonarqube_26_1\sonarqube_extensions
  sonar_postgresql_data:
    name: sonar_26_1_postgresql_data
    driver: local
    driver_opts:
      o: bind
      type: none
      device: C:\Docker\sonarqube_26_1\postgresql_data

networks:
  sonarnet:
